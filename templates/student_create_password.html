<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth">

<header class="site-nav" role="banner">
    <div class="site-nav-inner">
        <div class="site-brand" aria-label="System">
            <div class="site-brand-title">Student Grievance Redressal System</div>
            <div class="site-brand-sub">RPA FIRST GRADE COLLEGE</div>
        </div>
        <div class="site-actions"></div>
    </div>
</header>

<main class="container container--auth" role="main">
    <section class="glass auth-card" aria-label="Create password">
        <div class="glass-header">
            <div class="panel-title" style="display:flex; align-items:center; gap:10px;">
                <a class="btn btn--ghost" href="/student_register" data-no-transition="true" aria-label="Back">←</a>
                <span class="brand-mark" aria-hidden="true" style="width:34px; height:34px; border-radius:12px;">🔐</span>
                {{ page_title }}
            </div>
            <div class="panel-hint">Create a password for your student account</div>
        </div>

        <div class="glass-body">
            {% if error %}
                <div class="help" style="color: var(--danger); font-weight: 800; margin-bottom: 12px;">{{ error }}</div>
            {% endif %}

            <div class="help" style="margin-bottom: 14px;">
                Register number: <strong>{{ register_number }}</strong><br />
                Student name: <strong>{{ student_name }}</strong>
            </div>

            <form method="POST" novalidate class="stagger">
                <div class="field" style="--i:0">
                    <label class="label" for="password">Password <span class="req" aria-hidden="true">*</span></label>
                    <div class="input-wrap">
                        <input id="password" type="password" name="password" placeholder="Create password" autocomplete="new-password" required />
                        <button type="button" class="toggle-pass" aria-label="Show password" aria-pressed="false" data-toggle-password data-target="#password">
                            <svg class="icon eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/>
                            </svg>
                            <svg class="icon eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M10.6 10.6A2.5 2.5 0 0 0 12 15.5a2.5 2.5 0 0 0 1.4-.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M6.3 6.7C3.6 8.7 2 12 2 12s3.5 7 10 7c2.1 0 3.9-.6 5.3-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M9.3 4.8A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a16.6 16.6 0 0 1-3.6 4.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field" style="--i:1">
                    <label class="label" for="confirm_password">Confirm Password <span class="req" aria-hidden="true">*</span></label>
                    <div class="input-wrap">
                        <input id="confirm_password" type="password" name="confirm_password" placeholder="Confirm password" autocomplete="new-password" required />
                        <button type="button" class="toggle-pass" aria-label="Show password" aria-pressed="false" data-toggle-password data-target="#confirm_password">
                            <svg class="icon eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/>
                            </svg>
                            <svg class="icon eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M10.6 10.6A2.5 2.5 0 0 0 12 15.5a2.5 2.5 0 0 0 1.4-.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M6.3 6.7C3.6 8.7 2 12 2 12s3.5 7 10 7c2.1 0 3.9-.6 5.3-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M9.3 4.8A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a16.6 16.6 0 0 1-3.6 4.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-actions" style="--i:2">
                    <button type="submit" class="btn btn--primary btn--glow">Create Password</button>
                    <a class="btn btn--ghost" href="/student_register" data-no-transition="true">Cancel</a>
                </div>
            </form>
        </div>
    </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
